<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Evliya Celebi | Blog</title>
    <style>
      :root {
        --bg: #20140f;
        --panel: #2b1b14;
        --ink: #f4dfc8;
        --muted: #c89f7a;
        --foam: #f8ead8;
        --border: rgba(246, 214, 178, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 10%, rgba(214, 155, 93, 0.18), transparent 24rem),
          linear-gradient(180deg, #160d09 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        line-height: 1.7;
      }

      a {
        color: var(--foam);
        text-decoration: none;
      }

      .page {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0 36px;
      }

      .card {
        border: 1px solid var(--border);
        background: rgba(43, 27, 20, 0.86);
        padding: 30px;
      }

      h1 {
        color: var(--foam);
        font-size: clamp(42px, 8vw, 84px);
        letter-spacing: -0.06em;
        line-height: 1;
        margin: 0 0 18px;
      }

      .muted {
        color: var(--muted);
      }

      .post-list {
        display: grid;
        gap: 12px;
        list-style: none;
        margin: 30px 0 0;
        padding: 0;
      }

      .post-list a {
        display: block;
        border: 1px solid var(--border);
        background: rgba(139, 94, 60, 0.2);
        padding: 14px;
      }

      .post-list span {
        color: var(--muted);
        display: block;
      }

      .nav {
        border-top: 1px dashed var(--border);
        margin-top: 34px;
        padding-top: 18px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="muted">$ ls ./blog/posts</p>
        <h1>Field Notes</h1>
        <p class="muted">Coffee-warm dispatches from streets, software, and small journeys.</p>

        <ol class="post-list">
          <li>
            <a href="/blog/evliya-in-istanbul">
              <span>Evliya in Istanbul</span>
              A tiny story about listening to the city before writing it down.
            </a>
          </li>
        </ol>

        <p class="nav"><a href="/">cd home</a> &nbsp; <a href="/app/">open app</a></p>
      </section>
    </main>
  </body>
</html>
