{{- if .Values.mongo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongo.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pasha-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  selector:
    {{- include "pasha-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
  ports:
    - name: mongo
      port: {{ .Values.mongo.service.port }}
      targetPort: mongo
{{- end }}
